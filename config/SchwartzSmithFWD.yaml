
param_names: [kappa, mu_xi, sigma_chi, sigma_xi, rho, lambda_chi, chi0, xi0]

model:
  hidden_dims: [64, 128, 128, 64]
  activation: gelu

training:
  n_samples: 500000
  batch_size: 2048
  differential_loss_alpha: 0.10
  differential_loss_beta:  0.10
  n_epochs: 600
  patience: 40
  learning_rate: 3.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine # for cosine annealing, or step for step decay
  val_fraction: 0.1
  seed: 42

data:
  maturities: [0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0, 5.0, 7.0, 10.0]  # years
  priors:
    kappa:   [0.05,  5.0]   # mean-reversion speed (1/year)
    mu_xi:   [0.0,  0.1]   # long-term drift
    sigma_chi: [0.05, 0.60] # short-term vol
    sigma_xi:  [0.05, 0.40] # long-term vol
    rho:       [-0.95, 0.95]  # correlation
    lambda_chi: [-0.5, 0.5] # market price of short-term risk 
    chi0:    [-0.5, 0.5]    # initial short-term factor STATE_BOUNDS
    xi0:     [2.5,  5.0]    # initial long-term factor (log price ~3-4) STATE_BOUNDS
  contract:
    moneyness : [0.80, 1.20]   # K / F(0, T_fut)
    T_option  : [0.25, 2.0]    # option expiry in years
    r         : [0.02, 0.08]   # risk-free rate
  TAU_EXTRA  : [0.0, 0.5]     # extra time to expiry for the underlying futures contract (in years)

  save_path: /data/wiay/postgrads/shashwat/COMM_DATA/training_data

output:

  checkpoint_dir: /data/wiay/postgrads/shashwat/COMM_DATA/results/checkpoints/
  log_dir: /data/wiay/postgrads/shashwat/COMM_DATA/results/logs
  plot_dir: /data/wiay/postgrads/shashwat/COMM_DATA/results/plots/
